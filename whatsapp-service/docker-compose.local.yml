services:
  whatsapp-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siparik-whatsapp-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      WA_RUNTIME_MODE: docker-local
      WA_SESSION_PATH: /data/.wwebjs_auth
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "${WA_DOCKER_PORT:-3001}:3000"
    volumes:
      - whatsapp_session:/data
    shm_size: 1gb
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  whatsapp_session:
